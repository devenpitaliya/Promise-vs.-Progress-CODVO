name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app migrations && ruff format --check app
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci.db
        run: alembic upgrade head && alembic check
      - name: Tests (SQLite)
        run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pvp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations on Postgres match models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        env:
          SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
        run: docker compose build
      - name: Smoke test the stack
        env:
          SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
          WEB_PORT: "8080"
        run: |
          docker compose up -d --wait
          curl --fail --silent http://localhost:8080/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/meetings/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/reconciliation)" = "200"
          docker compose down -v
